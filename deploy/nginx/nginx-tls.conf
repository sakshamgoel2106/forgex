# =============================================================================
# ForgeX AI — Enterprise On-Premise Nginx TLS Configuration
# =============================================================================
# Provides HTTPS termination for on-premise air-gapped deployments.
# Mandatory for Service Workers, Camera (QR/LOTO), and Microphone (Voice Copilot).
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

    # Upstream to ForgeX Single-Origin Service (Node.js API serving web when SERVE_WEB=true)
    upstream forgex_backend {
        server api:4000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP: Port 80 Redirect to HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS: Port 443 TLS Termination
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates (Provided via Corporate CA, mkcert, or internal PKI)
        ssl_certificate     /etc/nginx/certs/forgex.crt;
        ssl_certificate_key /etc/nginx/certs/forgex.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # All requests proxy to single ForgeX API origin (which serves SPA + API)
        location / {
            proxy_pass http://forgex_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
